plugins {
    id 'com.android.application'
}

// Each cloud build gets a higher version number, so a new APK installs over the old one
// and keeps your history.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'com.reelscounter'
    compileSdk 35

    defaultConfig {
        applicationId "com.reelscounter"
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1." + buildNumber
    }

    // Fixed signing key, so every new build can update the installed app.
    signingConfigs {
        debug {
            storeFile file('reels.keystore')
            storeType 'pkcs12'
            storePassword 'reelscounter'
            keyAlias 'reels'
            keyPassword 'reelscounter'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
